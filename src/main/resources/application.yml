server:
  port: 8080

spring:
  datasource:

    url: jdbc:mysql://${DB_HOST:localhost}:3306/whis
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:whis-super-secret-key-change-this}
  expiration: 3600000
