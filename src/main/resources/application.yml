server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/whis
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: whis-super-secret-key-change-this
  expiration: 3600000
